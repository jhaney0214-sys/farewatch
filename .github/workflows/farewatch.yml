# Runs the test suite. Nothing here builds a report or deploys anything.
#
# This workflow used to run Farewatch twice a day and publish out/ to GitHub
# Pages. That was right while the repository was private and wrong the moment
# it was not: the report is ranked against config/profile.json, so publishing
# it broadcasts the home airports, budget and wishlist it was built from.
#
# Pages now serves docs/ from the default branch, which is a static page about
# the project and contains nothing personal. If you want the report published,
# run it somewhere that is yours and keep the profile out of the artifact.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install - that is the point.
      - name: Test
        run: python -m unittest discover -s tests
